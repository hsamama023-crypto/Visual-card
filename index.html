<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zain & Aeman Invitation</title>
<style>
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:Arial}
.card{width:92%;max-width:360px;background:#fff8e7;border-radius:20px;overflow:hidden;border:2px solid gold;text-align:center}
.top{background:#111;color:gold;padding:22px}
.top h1{font-size:36px;margin:5px 0}
.mid{padding:20px}
input{width:100%;padding:13px;border-radius:8px;border:2px solid #111;text-align:center;font-size:16px;box-sizing:border-box}
button{width:100%;padding:13px;border-radius:8px;border:none;background:gold;font-weight:bold;margin-top:10px}
.bot{background:#111;color:#aaa;padding:10px;font-size:10px}
</style>
</head>
<body>
<div class="card">
<div class="top">
<div>BISMILLAH</div>
<h1>Zain & Aeman</h1>
<div style="font-size:10px;letter-spacing:2px">WEDDING INVITE</div>
</div>
<div class="mid">
<h3>Password Likho</h3>
<p style="font-size:12px;color:#666">Har naam ka alag password</p>
<input id="p" type="password" placeholder="Password">
<button onclick="go()">OPEN CARD</button>
<p id="e" style="color:red;font-size:12px"></p>
<p style="font-size:10px;color:#999">Demo: 1234</p>
</div>
<div class="bot">ZAIN & AEMAN 2026</div>
</div>
<script>
function go(){
var v=document.getElementById('p').value;
if(v.trim()==""){document.getElementById('e').innerHTML="Password likho";return}
location.href="card.html?pass="+encodeURIComponent(v);
}
</script>
</body>
</html>
