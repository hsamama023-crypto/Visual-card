<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zain & Aeman</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;font-family:'Poppins',sans-serif}
.main{width:100%;max-width:410px;background:#fffaf0;border-radius:24px;overflow:hidden;border:2px solid #d4af37}
.top{height:240px;background:#111;position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden}
.top img{width:100%;height:100%;object-fit:cover;opacity:.5;position:absolute}
.top-content{position:relative;z-index:2;text-align:center;color:#fff}
.bism{font-family:'Amiri',serif;font-size:19px;color:#ffda6b}
.couple{font-family:'Great Vibes',cursive;font-size:54px;color:#ffda6b}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
.slide{min-width:100%;scroll-snap-align:start;padding:16px;text-align:center}
.cardBox{background:#fff;border:1px solid gold;border-radius:16px;padding:16px;box-shadow:0 8px 18px rgba(0,0,0,.12)}
.ev{font-size:11px;letter-spacing:2px;color:#fff;background:#8B0000;padding:5px 14px;border-radius:20px;display:inline-block}
.input{width:100%;padding:13px;border-radius:10px;border:2px solid #111;text-align:center}
.btn{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#b8960c,#d4af37);font-weight:800;margin-top:8px;cursor:pointer}
.foot{background:#111;color:#888;padding:10px;text-align:center;font-size:9px}
</style>
</head>
<body>
<div class="main">
<div class="top">
<img id="bgPic" src="" style="display:none">
<div class="top-content">
<div class="bism">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
<div class="couple">Zain & Aeman</div>
<div style="font-size:9px;letter-spacing:3px;color:#c9a86a;margin-top:4px">WEDDING INVITATION</div>
</div>
</div>

<div id="lock" style="padding:18px;text-align:center">
<h3 style="color:#8B0000">🔐 Private Invitation</h3>
<input id="p" type="password" class="input" placeholder="Password likho" style="margin-top:10px">
<button class="btn" onclick="unlock()">CARD KHOLO</button>
<p id="e" style="color:red;font-size:11px;margin-top:6px"></p>
<p style="font-size:9px;color:#aaa;margin-top:4px">Demo: 1234</p>
</div>

<div id="cards" style="display:none">
<h2 id="gName" style="color:#8B0000;text-align:center;margin:12px 0"></h2>
<div class="slider">
<div class="slide">
<div class="cardBox">
<div class="ev">BARAT CEREMONY</div>
<div class="couple" style="font-size:40px;color:#8B0000;margin:8px 0">Barat</div>
<div style="text-align:left;font-size:12.5px;line-height:2.2">
📅 <b>Date:</b> <span id="bDate"></span><br>
⏰ <b>Time:</b> <span id="bTime"></span><br>
📍 <b>Venue:</b> <span id="bVenue"></span>
</div>
</div>
</div>
<div class="slide">
<div class="cardBox">
<div class="ev" style="background:#111">WALIMA CEREMONY</div>
<div class="couple" style="font-size:40px;color:#8B0000;margin:8px 0">Walima</div>
<div style="text-align:left;font-size:12.5px;line-height:2.2">
📅 <b>Date:</b> <span id="wDate"></span><br>
⏰ <b>Time:</b> <span id="wTime"></span><br>
📍 <b>Venue:</b> <span id="wVenue"></span>
</div>
</div>
</div>
</div>
<p style="text-align:center;font-size:10px;color:#666;margin:8px">👉 Slide karo: Barat ➡️ Walima</p>
<button class="btn" style="margin:0 16px 14px 16px;width:calc(100% - 32px);background:#111;color:gold" onclick="location.reload()">🔒 Lock</button>
</div>

<div id="admin" style="display:none;padding:14px;text-align:left">
<input type="file" id="picUp" accept="image/*"><button class="btn" style="background:red;color:#fff;padding:6px" onclick="removePic()">Remove Pic</button>
<h4>Barat</h4><input id="bd" class="input" placeholder="Barat Date"><input id="bt" class="input" placeholder="Barat Time" style="margin-top:4px"><input id="bv" class="input" placeholder="Barat Venue" style="margin-top:4px">
<h4>Walima</h4><input id="wd" class="input" placeholder="Walima Date"><input id="wt" class="input" placeholder="Walima Time" style="margin-top:4px"><input id="wv" class="input" placeholder="Walima Venue" style="margin-top:4px">
<button class="btn" onclick="saveAll()">Save</button>
<textarea id="list" rows="4" class="input" style="text-align:left;margin-top:6px" placeholder="Naam,Password"></textarea><button class="btn" style="background:#111;color:gold" onclick="addGuests()">Add Guests</button>
</div>

<div class="foot">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ • ZAIN & AEMAN</div>
</div>
<script>
let cfg=JSON.parse(localStorage.getItem('ZAIN_CFG')||'{}');
let BD=cfg.bd||"12 Dec 2026",BT=cfg.bt||"07:00 PM",BV=cfg.bv||"Al Janat Marquee, Gujranwala";
let WD=cfg.wd||"13 Dec 2026",WT=cfg.wt||"01:00 PM",WV=cfg.wv||"Royal Palace, Gujranwala";
function apply(){document.getElementById('bDate').innerText=BD;document.getElementById('bTime').innerText=BT;document.getElementById('bVenue').innerText=BV;document.getElementById('wDate').innerText=WD;document.getElementById('wTime').innerText=WT;document.getElementById('wVenue').innerText=WV;let pic=localStorage.getItem('ZAIN_PIC');if(pic){let img=document.getElementById('bgPic');img.src=pic;img.style.display='block'}}apply();
let guests=JSON.parse(localStorage.getItem('ZAIN_GUESTS')||'[]');
let ps=new URLSearchParams(location.search);
if(ps.get('pass')){document.getElementById('p').value=ps.get('pass');setTimeout(unlock,300)}
if(ps.get('admin')==="Zain@2026"){document.getElementById('lock').style.display='none';document.getElementById('admin').style.display='block'}
function unlock(){let v=document.getElementById('p').value.trim();if(!v){document.getElementById('e').innerText="Password likho";return}if(v==="1234"){show("Mehman");return}let f=guests.find(x=>x.pass===v);if(f)show(f.name);else document.getElementById('e').innerText="Galat Password"}
function show(n){document.getElementById('gName').innerText="Dear "+n+" ❤️";document.getElementById('lock').style.display='none';document.getElementById('cards').style.display='block'}
function saveAll(){localStorage.setItem('ZAIN_CFG',JSON.stringify({bd:document.getElementById('bd').value||BD,bt:document.getElementById('bt').value||BT,bv:document.getElementById('bv').value||BV,wd:document.getElementById('wd').value||WD,wt:document.getElementById('wt').value||WT,wv:document.getElementById('wv').value||WV}));location.reload()}
function addGuests(){let lines=document.getElementById('list').value.trim().split('\n');lines.forEach(l=>{let a=l.split(',');if(a.length>=2)guests.push({name:a[0].trim(),pass:a[1].trim()})});localStorage.setItem('ZAIN_GUESTS',JSON.stringify(guests));alert("Saved")}
document.getElementById('picUp')?.addEventListener('change',e=>{let r=new FileReader();r.onload=()=>{localStorage.setItem('ZAIN_PIC',r.result);apply()};r.readAsDataURL(e.target.files[0])});
function removePic(){localStorage.removeItem('ZAIN_PIC');document.getElementById('bgPic').style.display='none'}
</script>
</body></html>
