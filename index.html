<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zain & Aeman - Private Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;700;800&family=Amiri&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background: radial-gradient(circle at top, #1e1e1e, #000); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:14px; font-family:'Poppins',sans-serif;}
.card{width:100%; max-width:400px; background:#fdf8e8; border-radius:26px; overflow:hidden; box-shadow:0 0 0 2px #d4af37, 0 0 35px rgba(212,175,55,.6), 0 35px 80px rgba(0,0,0,.8);}
.header{background: linear-gradient(135deg, #0a0a0a, #1e1e1e); padding:32px 20px 26px; text-align:center; border-bottom:3px solid #d4af37;}
.bism{font-family:'Amiri',serif; color:#d4af37; font-size:22px; margin-bottom:8px;}
.couple{font-family:'Great Vibes',cursive; font-size:52px; color:#d4af37; line-height:1;}
.sub{color:#c9a86a; letter-spacing:4px; font-size:10px; margin-top:8px; font-weight:700;}
.body{padding:26px 22px; text-align:center; background: radial-gradient(circle at center, #fffcf0, #fdf6e3);}
.lock{background:#fff; border:1.5px solid #e9d8a6; border-radius:16px; padding:18px; box-shadow:inset 0 2px 10px rgba(0,0,0,.04);}
input{width:100%; padding:15px; border-radius:12px; border:2px solid #111; text-align:center; font-size:16px; outline:none;}
input:focus{border-color:#d4af37;}
.btn{width:100%; padding:14px; border-radius:12px; border:none; background: linear-gradient(135deg,#b8960c,#d4af37,#f0c75e); color:#000; font-weight:800; font-size:15px; cursor:pointer; margin-top:12px; box-shadow:0 8px 20px rgba(212,175,55,.4);}
.footer{background:#111; color:#c9a86a; text-align:center; padding:14px; font-size:10px; letter-spacing:3px; border-top:1px solid #d4af37;}
.err{color:#c0392b; font-size:12px; margin-top:8px; min-height:16px; font-weight:600;}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="bism">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
    <div class="couple">Zain & Aeman</div>
    <div class="sub">PRIVATE WEDDING INVITATION</div>
  </div>
  <div class="body">
    <h3 style="color:#8B0000; font-size:20px;">🔐 Private Invitation</h3>
    <p style="font-size:12px; color:#8a7a5a; margin:8px 0 14px;">Har mehman ka alag password hai<br>Password likho to aapka naam wala card khulega</p>
    <div class="lock">
      <input id="pass" type="password" placeholder="🔑 Apna Password Likho">
      <button class="btn" onclick="goToCard()">✨ CARD KHOLO ✨</button>
      <div class="err" id="err"></div>
    </div>
    <p style="font-size:10px; color:#aaa; margin-top:12px;">Demo: 1234 | Admin: admin.html</p>
  </div>
  <div class="footer">ZAIN ❤️ AEMAN • PRIVATE INVITE</div>
</div>
<script>
function goToCard(){
  let p = document.getElementById('pass').value.trim();
  if(!p){ document.getElementById('err').innerText = "⚠️ Password likho"; return; }
  location.href = "card.html?pass=" + encodeURIComponent(p);
}
let q = new URLSearchParams(location.search);
if(q.get('pass')){ document.getElementById('pass').value = q.get('pass'); goToCard(); }
document.getElementById('pass').addEventListener('keypress', function(e){ if(e.key==='Enter') goToCard(); });
</script>
</body>
</html>
