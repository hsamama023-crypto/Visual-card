<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zain & Aeman - Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;800&family=Amiri&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at top,#222,#000);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:14px;font-family:'Poppins',sans-serif}
.card{width:100%;max-width:400px;background:#fdf8e8;border-radius:26px;overflow:hidden;border:2px solid #d4af37;box-shadow:0 0 30px rgba(212,175,55,.5)}
.header{background:linear-gradient(135deg,#0a0a0a,#1e1e1e);padding:30px 20px;text-align:center;border-bottom:3px solid #d4af37}
.bism{font-family:'Amiri',serif;color:#d4af37;font-size:22px;margin-bottom:6px}
.couple{font-family:'Great Vibes',cursive;font-size:52px;color:#d4af37;line-height:1}
.sub{color:#c9a86a;letter-spacing:4px;font-size:10px;margin-top:8px;font-weight:600}
.body{padding:24px 20px;text-align:center;background:radial-gradient(circle at center,#fffcf0,#fdf6e3)}
.title{color:#8B0000;font-weight:800;font-size:18px}
.desc{color:#8a7a5a;font-size:12px;margin:8px 0 16px;line-height:1.5}
.box{background:#fff;border:1.5px solid #e9d8a6;border-radius:14px;padding:16px}
.input{width:100%;padding:14px;border-radius:10px;border:2px solid #111;text-align:center;font-size:16px;outline:none}
.input:focus{border-color:#d4af37}
.btn{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#b8960c,#d4af37);color:#000;font-weight:800;font-size:15px;cursor:pointer;margin-top:12px}
.btn:active{transform:scale(.97)}
.err{color:#c0392b;font-size:12px;margin-top:8px;min-height:14px;font-weight:600}
.foot{background:#111;color:#c9a86a;text-align:center;padding:12px;font-size:10px;letter-spacing:3px;border-top:1px solid #d4af37}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="bism">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
    <div class="couple">Zain & Aeman</div>
    <div class="sub">PRIVATE WEDDING INVITATION</div>
  </div>
  <div class="body">
    <div class="title">🔐 Private Invitation</div>
    <div class="desc">Har mehman ka alag password hai<br>Password likho to aapke naam ka card khulega</div>
    <div class="box">
      <input class="input" id="pass" type="password" placeholder="🔑 Apna Password Likho">
      <button class="btn" onclick="openCard()">✨ CARD KHOLO ✨</button>
      <div class="err" id="err"></div>
    </div>
    <div style="font-size:10px;color:#aaa;margin-top:12px">Demo: 1234 | Admin: admin.html</div>
  </div>
  <div class="foot">ZAIN ❤️ AEMAN • 2026</div>
</div>

<script>
function openCard(){
  var p = document.getElementById('pass').value.trim();
  if(!p){
    document.getElementById('err').innerText = "Password likho";
    return;
  }
  window.location.href = "card.html?pass=" + encodeURIComponent(p);
}
document.getElementById('pass').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ openCard(); }
});
var url = new URLSearchParams(window.location.search);
if(url.get('pass')){
  document.getElementById('pass').value = url.get('pass');
  openCard();
}
</script>
</body>
</html>
