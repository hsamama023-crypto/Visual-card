<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - LIVE Bug Free</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:12px}
.card{background:#1e1e1e;border:2px solid #facc15;border-radius:16px;padding:16px;margin-bottom:14px}
h2{color:#facc15;text-align:center;margin:10px 0}
label{color:#facc15;font-size:12px;display:block;margin-top:10px;font-weight:600}
input,textarea,select{width:100%;background:#2a2a2a;border:1px solid #555;color:#fff;padding:12px;border-radius:10px;margin:6px 0}
.btn{width:100%;background:#facc15;color:#000;font-weight:700;padding:13px;border:none;border-radius:12px;margin:6px 0;cursor:pointer}
.item{background:#2a2a2a;padding:10px;border-radius:10px;margin:6px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<h2>👑 Admin - LIVE</h2>
<div class="card">
<label>💒 Dulha Dulhan Name</label>
<input id="c1" placeholder="Hasan"><input id="c2" placeholder="Hira">
<label>🏛️ Venue</label><input id="venue" placeholder="Gujranwala">
<label>🖼️ Couple Pic</label><input type="file" id="picInput" accept="image/*"><div id="picPreview"></div>
<label>📅 Barat</label><input id="bd" placeholder="12 Dec 2026"><input id="bt" placeholder="07:00 PM"><input id="bv" placeholder="Barat Venue">
<label>📅 Walima</label><input id="wd" placeholder="13 Dec 2026"><input id="wt" placeholder="01:00 PM"><input id="wv" placeholder="Walima Venue">
<button class="btn" id="saveBtn">💾 Save LIVE</button>
<p id="saveMsg" style="text-align:center;color:#22c55e;font-size:12px;margin-top:6px"></p>
</div>
<div class="card">
<h3 style="color:#facc15">👑 Mehman List</h3>
<input id="gName" placeholder="Naam: Ali"><input id="gPass" placeholder="Password: 1234">
<input id="gPersons" placeholder="Full Family" value="Full Family">
<select id="gEvent"><option value="both">Barat & Walima (Dono)</option><option value="barat">Barat Only</option><option value="walima">Walima Only</option></select>
<button class="btn" id="addOneBtn">+ ADD</button>
<textarea id="bulkInput" rows="3" placeholder="Ali,1234,walima&#10;Ahmed,5678,barat&#10;Umar,9999,both"></textarea>
<button class="btn" id="addBulkBtn">🚀 Bulk Add</button>
<input id="searchInput" placeholder="Search...">
<div id="guestList" style="margin-top:10px;max-height:400px;overflow:auto"></div>
<p id="totalCount"></p>
</div>
<button onclick="location.href='index.html'" style="width:100%;padding:10px;background:#333;color:#fff;border:none;border-radius:8px">⬅️ Card Dekho</button>
<script>
const sb = supabase.createClient('https://saaoukcqwqnxgmcuojjl.supabase.co','sb_publishable_T5X1hJ1PMplw7BX5unufjg_0wJggkG8');
window._pics=[]; window._song='';
function compressImage(file,cb){const r=new FileReader(); r.onload=e=>{const img=new Image(); img.onload=()=>{const canvas=document.createElement('canvas'); const maxW=500; const scale=Math.min(1,maxW/img.width); canvas.width=img.width*scale; canvas.height=img.height*scale; canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height); cb(canvas.toDataURL('image/jpeg',0.5));}; img.src=e.target.result;}; r.readAsDataURL(file);}
async function loadSettings(){try{let {data}=await sb.from('settings').select('*').eq('id',1).single(); if(data){ if(data.c1) c1.value=data.c1; if(data.c2) c2.value=data.c2; if(data.venue) venue.value=data.venue; if(data.bv) bv.value=data.bv; if(data.wv) wv.value=data.wv; if(data.bd) bd.value=data.bd; if(data.bt) bt.value=data.bt; if(data.wd) wd.value=data.wd; if(data.wt) wt.value=data.wt; if(data.pic){try{let pics=JSON.parse(data.pic); window._pics=Array.isArray(pics)?pics:[data.pic]; if(window._pics[0]) picPreview.innerHTML='<img src="'+window._pics[0]+'" style="max-width:100%;border-radius:10px">';}catch{}} }}catch(e){}}
picInput.addEventListener('change',function(){if(!this.files[0]) return; compressImage(this.files[0],c=>{window._pics=[c]; picPreview.innerHTML='<img src="'+c+'" style="max-width:100%;border-radius:10px">';});});
saveBtn.addEventListener('click',async()=>{
  let c1v=c1.value.trim(), c2v=c2.value.trim(); if(!c1v||!c2v){alert('Dono naam likho');return;}
  saveMsg.innerText='⏳ Saving...';
  let payload={id:1,c1:c1v,c2:c2v,venue:venue.value,bd:bd.value,bt:bt.value,bv:bv.value||venue.value,wd:wd.value,wt:wt.value,wv:wv.value||venue.value,barat_date:bd.value,barat_time:bt.value,barat_venue:bv.value||venue.value,walima_date:wd.value,walima_time:wt.value,walima_venue:wv.value||venue.value};
  if(window._pics[0] && window._pics[0].length<500000) payload.pic=JSON.stringify(window._pics);
  let {error}=await sb.from('settings').upsert(payload,{onConflict:'id'});
  saveMsg.innerText=error?'❌ '+error.message:'✅ Saved! '+c1v+' & '+c2v;
});
addOneBtn.addEventListener('click',async()=>{
  let n=gName.value.trim(), p=gPass.value.trim(); if(!n||!p){alert('Naam Password');return;}
  let {error}=await sb.from('guests').insert({name:n,pass:p,persons:gPersons.value,event:gEvent.value});
  if(error) alert(error.message); else {gName.value=''; gPass.value=''; render();}
});
addBulkBtn.addEventListener('click',async()=>{
  let txt=bulkInput.value.trim(); if(!txt) return; let arr=[];
  txt.split('\n').forEach(l=>{
    let sp=l.split(','); if(sp.length>=2){
      let ev=sp[2]?sp[2].trim().toLowerCase():'both';
      if(!['barat','walima','both'].includes(ev)) ev='both';
      arr.push({name:sp[0].trim(),pass:sp[1].trim(),event:ev,persons:'Full Family'});
    }
  });
  if(arr.length){let {error}=await sb.from('guests').insert(arr); if(error) alert(error.message); else render();}
});
async function render(){
  let q=searchInput.value.toLowerCase();
  let {data:g}=await sb.from('guests').select('*').order('id',{ascending:false});
  if(!g) return;
  let f=g.filter(x=>x.name.toLowerCase().includes(q));
  guestList.innerHTML=f.map(x=>`<div class="item"><span><b>${x.name}</b> - ${x.pass} - <span style="color:#facc15">${x.event}</span></span><button onclick="delOne(${x.id})" style="background:#ef4444;color:#fff;border:none;padding:4px 8px;border-radius:5px">X</button></div>`).join('');
  totalCount.innerText='Total: '+g.length;
}
window.delOne=async id=>{if(!confirm('Delete?')) return; await sb.from('guests').delete().eq('id',id); render();}
searchInput.addEventListener('input',render);
loadSettings(); render();
</script>
</body>
</html>
